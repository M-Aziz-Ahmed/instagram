# Redis for multi-instance live-server.
#
# Install on the box that already hosts Mongo (the shared database every live-server
# instance connects to). Copy to /etc/redis/redis.conf, then set requirepass below.
#
#   sudo cp redis.conf /etc/redis/redis.conf
#   sudo systemctl restart redis-server
#
# Then point every live-server at it, centrally and in each desktop build:
#   REDIS_URL=redis://:<password>@<host>:6379

# ── Network ───────────────────────────────────────────────────────────────────
# Must be reachable by every user's desktop instance, so it cannot stay on
# localhost. Bind the LAN interface rather than 0.0.0.0 so it is not exposed on a
# public interface, and rely on requirepass plus the firewall below.
bind 127.0.0.1 192.168.1.10
port 6379

# Never run Redis without a password on a shared network. An unauthenticated Redis
# reachable by anyone allows arbitrary writes, and by extension remote code execution
# on the host via its replication and Lua features. SET THIS.
requirepass CHANGE_ME_STRONG_PASSWORD

# ── Persistence ───────────────────────────────────────────────────────────────
# Redis is only the delivery bus for socket rooms and rate-limit counters; Mongo is
# the source of truth. Losing Redis degrades the cluster to single-instance behaviour
# rather than losing data, so persistence is optional. Snapshots are kept because they
# make restarts cheaper and reduce cold-start chatter.
save 900 1
save 300 10
dir /var/lib/redis
dbfilename dump.rdb

# ── Memory ────────────────────────────────────────────────────────────────────
# Pub/sub buffers for a busy socket cluster; eviction must not happen, because a
# silently evicted key would look like a lost event.
maxmemory 512mb
maxmemory-policy noeviction

# ── Cluster fan-out ───────────────────────────────────────────────────────────
# Every instance publishes and subscribes. pubsub clients are exempt from the
# output buffer limits so a slow subscriber cannot be disconnected mid-handshake
# during an ICE-candidate burst.
client-output-buffer-limit pubsub 32mb 8mb 60

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/redis/redis-server.log
