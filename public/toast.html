<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AnonTweet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #161616;
    color: #fff;
    border: 1px solid #333;
    user-select: none;
  }
  .toast {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 40px 12px 16px;
    cursor: pointer;
  }
  .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    border-radius: 10px;
    background: #3b82f6;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    color: #fff;
  }
  .title {
    font-weight: 700;
    font-size: 14px;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .body {
    margin-top: 4px;
    font-size: 13px;
    color: #aaa;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .close {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 22px;
    height: 22px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    color: #888;
    font-size: 15px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .close:hover { background: rgba(255,255,255,0.2); color: #fff; }
  .bar {
    position: absolute;
    bottom: 0;
    left: 0;
    height: 3px;
    width: 100%;
    background: #3b82f6;
    animation: shrink 8s linear forwards;
  }
  @keyframes shrink { from { width: 100%; } to { width: 0%; } }
</style>
</head>
<body>
  <div class="toast" id="toast">
    <span class="icon">A</span>
    <button class="close" id="close" title="Dismiss">×</button>
    <div class="title" id="title"></div>
    <div class="body" id="body"></div>
    <div class="bar"></div>
  </div>
  <script>
    const data = window.__TOAST_DATA__ || {};
    const titleEl = document.getElementById("title");
    const bodyEl = document.getElementById("body");
    titleEl.textContent = data.title || "AnonTweet";
    bodyEl.textContent = data.body || "";

    function notifyApp(method, args) {
      if (window.__TAURI__ && window.__TAURI__.invoke) {
        try {
          window.__TAURI__.invoke(method, args).catch(() => {});
          return true;
        } catch (e) {
          return false;
        }
      }
      return false;
    }

    document.getElementById("toast").addEventListener("click", (e) => {
      if (e.target.id === "close") return;
      if (!notifyApp("handle_toast_click", { id: data.id })) {
        window.close();
      }
    });

    document.getElementById("close").addEventListener("click", () => {
      if (!notifyApp("close_toast", { id: data.id })) {
        window.close();
      }
    });
  </script>
</body>
</html>
