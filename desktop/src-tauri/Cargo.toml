[package]
name = "anontweet"
version = "0.2.80"
description = "AnonTweet desktop companion"
authors = ["AnonTweet"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "anontweet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"

# Already present transitively via tauri; listed directly for the Job Object that
# reaps the embedded server when the app is killed instead of quit.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
