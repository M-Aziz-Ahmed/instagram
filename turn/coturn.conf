# coturn configuration for anontweet WebRTC relay.
#
# Run coturn on the SAME machine that runs the live-server (the one friends
# reach via anontweet.duckdns.org). It serves TURN-over-TLS on port 8443 so the
# relay works even behind restrictive networks / firewalls (e.g. China).
#
# NOTE: Caddy already uses :443 for signaling. To avoid a port conflict,
# coturn's TURN-over-TLS runs on :8443 here (commonly allowed through Chinese
# firewalls). If you prefer coturn on 443, move Caddy to another port first.
#
# The TLS cert/key below must be the SAME duckdns cert the live-server uses.
#
# These paths used to point at a developer's own WSL mount
# (/mnt/c/Users/munee/Desktop/work/instagram/live-server/cert.pem). That file
# does not exist on any other machine, so coturn failed to open its TLS listener
# and the relay was silently absent even on a box where WSL worked — which is
# exactly the failure that makes calls work for some users and never for others.
# They are now absolute paths under /etc/turn, which is where turn/install.sh
# puts them.

listening-port=3478
tls-listening-port=8443

# Listen on all interfaces
listening-ip=0.0.0.0
relay-ip=0.0.0.0

# Use the duckdns certificate (same as live-server), installed by turn/install.sh
cert=/etc/turn/cert.pem
pkey=/etc/turn/key.pem

# Authentication — static long-term credential via user=. MUST match
# NEXT_PUBLIC_TURN_USER / NEXT_PUBLIC_TURN_CRED in .env.
# NOTE: coturn has no static-user/static-password directives; use user= instead.
lt-cred-mech
user=anonturn:I_hateyou2

# Realm (used in TURN messages)
realm=anontweet.duckdns.org

# Logging
no-stdout-log
log-file=/var/log/turn.log
verbose

# Security / limits
max-port=65535
min-port=49152
no-multicast-peers
no-cli

# TLS — only allow 1.2+ (1.0/1.1 are insecure)
no-tlsv1
no-tlsv1_1

# Required for some WebRTC clients (browsers) to authenticate properly
fingerprint

# Allow relay to any peer IP (needed for WebRTC behind NAT/VPN)
allowed-peer-ip=0.0.0.0/0
